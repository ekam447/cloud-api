name: Deploy Cloud API to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/cloud-api
            git pull origin main

            sudo cp nginx/myawswebsite.conf /etc/nginx/conf.d/myawswebsite.conf
            sudo nginx -t
            sudo systemctl reload nginx

            cd app
            sudo docker build -t cloud-api:latest .
            cd ..
            sudo docker-compose up -d
